# OPTIONAL services for production-parity local development.
#
# The MVP's dev defaults are SQLite (file-backed) storage and a database-backed
# job queue, so neither service below is required for day-to-day development.
# Use this file only when you want to exercise production-parity data paths.

services:
  db:
    image: postgres:17-alpine
    container_name: opencontext-db
    environment:
      POSTGRES_USER: opencontext
      POSTGRES_PASSWORD: opencontext
      POSTGRES_DB: opencontext
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencontext -d opencontext"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: opencontext-web
    environment:
      DATABASE_URL: postgresql://opencontext:opencontext@db:5432/opencontext?schema=public
      AUTH_SECRET: local-compose-auth-secret-change-me
      DEV_AUTH_ENABLED: "true"
      DEV_AUTH_EMAIL: local@opencontext.dev
      STORAGE_PROVIDER: local
      STORAGE_PATH: /data/storage
      WORKER_API_TOKEN: local-compose-worker-token
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - media-data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 10s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: opencontext-worker
    environment:
      WORKER_API_URL: http://web:3000
      WORKER_API_TOKEN: local-compose-worker-token
      WORKER_ID: compose-worker
      TRANSCRIPTION_PROVIDER: faster_whisper
      TRANSCRIPTION_MODEL: tiny.en
      VISION_PROVIDER: fixture
      TEXT_PROVIDER: template
      FIXTURE_VISIBLE_TEXT: OpenContext local compose fixture
      HF_HOME: /models
    volumes:
      - whisper-models:/models
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres-data:
  media-data:
  whisper-models:
