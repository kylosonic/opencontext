# OPTIONAL services for production-parity local development.
#
# The MVP's dev defaults are SQLite (file-backed) storage and a database-backed
# job queue, so neither service below is required for day-to-day development.
# Use this file only when you want to exercise production-parity data paths.

services:
  db:
    image: postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
    container_name: opencontext-db
    environment:
      POSTGRES_USER: opencontext
      POSTGRES_PASSWORD: opencontext
      POSTGRES_DB: opencontext
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencontext -d opencontext"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: opencontext-web
    environment:
      OPENCONTEXT_ENV: local
      DATABASE_URL: postgresql://opencontext:opencontext@db:5432/opencontext?schema=public
      AUTH_SECRET: local-compose-auth-secret-change-me
      AUTH_TRUST_HOST: "true"
      DEV_AUTH_ENABLED: "true"
      DEV_AUTH_EMAIL: local@opencontext.dev
      STORAGE_PROVIDER: local
      STORAGE_PATH: /data/storage
      WORKER_API_TOKEN: local-compose-worker-token
      OPS_API_TOKEN: local-compose-ops-token
      NEXT_PUBLIC_APP_URL: ${OPENCONTEXT_APP_URL:-http://localhost:3000}
    ports:
      - "${OPENCONTEXT_WEB_BIND:-127.0.0.1}:${OPENCONTEXT_WEB_PORT:-3000}:3000"
    volumes:
      - media-data:/data
    depends_on:
      db:
        condition: service_healthy
      web-storage-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 10s
      retries: 12

  web-storage-init:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: opencontext-web
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      [
        "mkdir -p /data/storage && chown -R node:node /data/storage && exec setpriv --reuid=node --regid=node --clear-groups test -w /data/storage",
      ]
    volumes:
      - media-data:/data
    network_mode: none
    restart: "no"

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: opencontext-worker
    environment:
      WORKER_API_URL: http://web:3000
      WORKER_API_TOKEN: local-compose-worker-token
      WORKER_ID: compose-worker
      WORKER_SHUTDOWN_GRACE_SECONDS: 90
      TRANSCRIPTION_PROVIDER: ${OPENCONTEXT_TRANSCRIPTION_PROVIDER:-faster_whisper}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-tiny.en}
      VISION_PROVIDER: ${VISION_PROVIDER:-fixture}
      OPENAI_BASE_URL: ${OPENCONTEXT_DEMO_OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENCONTEXT_DEMO_OPENAI_API_KEY:-}
      OPENCODE_API_KEY: ${OPENCONTEXT_DEMO_OPENCODE_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      GEMINI_API_KEY: ${OPENCONTEXT_DEMO_GEMINI_API_KEY:-${GEMINI_API_KEY:-}}
      OPENCODE_SESSION_ID: ${OPENCODE_SESSION_ID:-opencontext-demo}
      VISION_MODEL: ${OPENCONTEXT_DEMO_MODEL:-gpt-4o-mini}
      VISION_FALLBACK_MODELS: ${VISION_FALLBACK_MODELS:-}
      VISION_REQUEST_INTERVAL_SECONDS: ${VISION_REQUEST_INTERVAL_SECONDS:-0}
      VISION_TIMEOUT_SECONDS: ${VISION_TIMEOUT_SECONDS:-120}
      VISION_MAX_FRAMES: ${VISION_MAX_FRAMES:-60}
      OCR_PROVIDER: vision
      OCR_LANGUAGE: eng
      TEXT_PROVIDER: ${TEXT_PROVIDER:-template}
      TEXT_MODEL: ${OPENCONTEXT_DEMO_MODEL:-gpt-4o-mini}
      FIXTURE_VISIBLE_TEXT: OpenContext local compose fixture
      HF_HOME: /models
      USE_FASTER_WHISPER: ${USE_FASTER_WHISPER:-1}
    volumes:
      - whisper-models:/models
    restart: unless-stopped
    stop_grace_period: 100s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "oc_worker.main",
          "--check-demo-vision",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      web:
        condition: service_healthy
      worker-cache-init:
        condition: service_completed_successfully

  worker-cache-init:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: opencontext-worker
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      [
        "mkdir -p /models/hub && chown -R 10001:10001 /models && exec setpriv --reuid=10001 --regid=10001 --clear-groups python -c \"import os; assert os.stat('/models').st_uid == 10001; open('/models/.write-test', 'w').close(); os.remove('/models/.write-test')\"",
      ]
    volumes:
      - whisper-models:/models
    network_mode: none
    restart: "no"

  s3mock:
    image: adobe/s3mock:5@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
    profiles: ["storage-test"]
    container_name: opencontext-s3mock
    ports:
      - "9090:9090"

volumes:
  postgres-data:
  media-data:
  whisper-models:
