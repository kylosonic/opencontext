# OPTIONAL services for production-parity local development.
#
# The MVP's dev defaults are SQLite (file-backed) storage and a database-backed
# job queue, so neither service below is required for day-to-day development.
# Use this file only when you want to exercise production-parity data paths.

services:
  db:
    image: postgres:17-alpine
    container_name: opencontext-db
    environment:
      POSTGRES_USER: opencontext
      POSTGRES_PASSWORD: opencontext
      POSTGRES_DB: opencontext
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencontext -d opencontext"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: opencontext-web
    environment:
      OPENCONTEXT_ENV: local
      DATABASE_URL: postgresql://opencontext:opencontext@db:5432/opencontext?schema=public
      AUTH_SECRET: local-compose-auth-secret-change-me
      DEV_AUTH_ENABLED: "true"
      DEV_AUTH_EMAIL: local@opencontext.dev
      STORAGE_PROVIDER: local
      STORAGE_PATH: /data/storage
      WORKER_API_TOKEN: local-compose-worker-token
      OPS_API_TOKEN: local-compose-ops-token
      NEXT_PUBLIC_APP_URL: ${OPENCONTEXT_APP_URL:-http://localhost:3000}
    ports:
      - "${OPENCONTEXT_WEB_PORT:-3000}:3000"
    volumes:
      - media-data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 10s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: opencontext-worker
    environment:
      WORKER_API_URL: http://web:3000
      WORKER_API_TOKEN: local-compose-worker-token
      WORKER_ID: compose-worker
      WORKER_SHUTDOWN_GRACE_SECONDS: 90
      TRANSCRIPTION_PROVIDER: faster_whisper
      TRANSCRIPTION_MODEL: tiny.en
      VISION_PROVIDER: fixture
      OCR_PROVIDER: vision
      OCR_LANGUAGE: eng
      TEXT_PROVIDER: template
      FIXTURE_VISIBLE_TEXT: OpenContext local compose fixture
      HF_HOME: /models
      USE_FASTER_WHISPER: ${USE_FASTER_WHISPER:-1}
    volumes:
      - whisper-models:/models
    restart: unless-stopped
    stop_grace_period: 100s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://web:3000/api/health/ready', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      web:
        condition: service_healthy
      worker-cache-init:
        condition: service_completed_successfully

  worker-cache-init:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: opencontext-worker
    user: "0:0"
    platform: linux/amd64
    entrypoint: ["sh", "-c"]
    command:
      [
        "mkdir -p /models/hub && chown -R 10001:10001 /models && exec setpriv --reuid=10001 --regid=10001 --clear-groups python -c \"import os; assert os.stat('/models').st_uid == 10001; open('/models/.write-test', 'w').close(); os.remove('/models/.write-test')\"",
      ]
    volumes:
      - whisper-models:/models
    network_mode: none
    restart: "no"

  s3mock:
    image: adobe/s3mock:5
    profiles: ["storage-test"]
    container_name: opencontext-s3mock
    ports:
      - "9090:9090"

volumes:
  postgres-data:
  media-data:
  whisper-models:
