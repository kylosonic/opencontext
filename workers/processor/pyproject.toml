[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "opencontext-video"
version = "0.1.1"
description = "Turn video and images into evidence-linked developer context for text-only AI"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "OpenContext contributors" }]
keywords = ["video", "transcription", "ocr", "developer-context", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "httpx>=0.28.1,<1",
  "imageio-ffmpeg>=0.8.1,<1",
  "pillow>=12,<14",
  "pydantic>=2.12,<3",
  "pypdfium2>=5,<6",
  "python-dotenv>=1.1,<2",
]

[project.urls]
Homepage = "https://github.com/kylosonic/opencontext"
Repository = "https://github.com/kylosonic/opencontext"
Issues = "https://github.com/kylosonic/opencontext/issues"

[project.scripts]
opencontext = "oc_worker.cli:main"
opencontext-mcp = "oc_worker.mcp_server:main"

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "mcp>=2.3,<3",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
  "twine>=6.2,<7",
]
agent = [
  "mcp>=2.3,<3",
]
local = [
  "faster-whisper>=1.2.1,<2",
  "av>=11,<19",
]

[tool.setuptools.packages.find]
where = ["src"]


[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
