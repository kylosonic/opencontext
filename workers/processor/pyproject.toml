[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opencontext-video"
version = "0.1.0"
description = "Turn video into evidence-linked developer context for text-only AI"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "OpenContext contributors" }]
keywords = ["video", "transcription", "ocr", "developer-context", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "httpx",
  "imageio-ffmpeg",
  "pydantic",
  "python-dotenv",
]

[project.urls]
Homepage = "https://github.com/kylosonic/opencontext"
Repository = "https://github.com/kylosonic/opencontext"
Issues = "https://github.com/kylosonic/opencontext/issues"

[project.scripts]
opencontext = "oc_worker.cli:main"

[project.optional-dependencies]
dev = [
  "build",
  "pytest",
  "ruff",
  "twine",
]
local = [
  "faster-whisper",
  "av>=11,<19",
]

[tool.setuptools.packages.find]
where = ["src"]


[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
