[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "oc-worker"
version = "0.1.0"
description = "OpenContext media processing worker"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "httpx",
  "pydantic",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]
local = [
  "faster-whisper",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
