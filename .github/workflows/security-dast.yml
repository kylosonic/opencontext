name: Security DAST baseline

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: opencontext-security-dast
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zap-baseline:
    if: github.repository == 'kylosonic/opencontext'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require staging target
        env:
          OPENCONTEXT_DAST_TARGET: ${{ vars.OPENCONTEXT_DAST_TARGET }}
        run: |
          test -n "$OPENCONTEXT_DAST_TARGET" || {
            echo "::error::Set the OPENCONTEXT_DAST_TARGET repository variable to a non-production staging URL.";
            exit 1;
          }
      - name: OWASP ZAP baseline
        uses: zaproxy/action-baseline@41aee98ebc7cf2802c3beae4e7d4336413a21e43 # v0.9.0
        with:
          target: ${{ vars.OPENCONTEXT_DAST_TARGET }}
          fail_action: true
          allow_issue_writing: false
          cmd_options: "-a -m 5 -T 120"
