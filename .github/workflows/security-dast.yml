name: Security DAST baseline

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      target_url:
        description: Optional external non-production staging URL (leave blank to scan ephemeral Docker Compose staging)
        required: false
        type: string

concurrency:
  group: opencontext-security-dast
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zap-baseline:
    if: github.repository == 'kylosonic/opencontext'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve DAST target
        id: target
        env:
          INPUT_TARGET_URL: ${{ inputs.target_url }}
          OPENCONTEXT_DAST_TARGET: ${{ vars.OPENCONTEXT_DAST_TARGET }}
        run: |
          target="${INPUT_TARGET_URL:-$OPENCONTEXT_DAST_TARGET}"
          target="${target%"${target##*[![:space:]]}"}"
          target="${target#"${target%%[![:space:]]*}"}"

          if [ -z "$target" ]; then
            echo "No external OPENCONTEXT_DAST_TARGET set; using ephemeral Docker Compose staging stack at http://localhost:3000."
            echo "mode=ephemeral" >> "$GITHUB_OUTPUT"
            echo "url=http://localhost:3000" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! [[ "$target" =~ ^https?://[^[:space:]]+$ ]]; then
            echo "::error::DAST target must be an http:// or https:// URL."
            exit 1
          fi

          echo "mode=external" >> "$GITHUB_OUTPUT"
          echo "url=$target" >> "$GITHUB_OUTPUT"

      - name: Start ephemeral Compose staging stack
        if: steps.target.outputs.mode == 'ephemeral'
        env:
          OPENCONTEXT_WEB_BIND: "0.0.0.0"
          OPENCONTEXT_APP_URL: "http://localhost:3000"
        run: |
          docker compose up -d --build db web
          for attempt in {1..60}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' opencontext-web 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              echo "Ephemeral staging stack is healthy."
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: OWASP ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ steps.target.outputs.url }}
          rules_file_name: .zap/rules.tsv
          fail_action: true
          allow_issue_writing: false
          cmd_options: "-a -m 5 -T 120 -I"

      - name: Upload ZAP baseline reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-baseline-report
          path: |
            report_html.html
            report_md.md
            report_json.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Tear down ephemeral Compose staging stack
        if: always() && steps.target.outputs.mode == 'ephemeral'
        run: docker compose down -v --remove-orphans
