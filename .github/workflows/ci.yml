name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr

      - name: Start S3Mock for storage integration
        run: |
          docker run -d --name opencontext-s3mock \
            -p 9090:9090 \
            adobe/s3mock:5
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:9090/; then
              exit 0
            fi
            sleep 2
          done
          docker logs opencontext-s3mock
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Verify measured evaluation video generator
        run: |
          npm run evaluation:video
          npm run evaluation:hearing-video
          npm run vision:fixture

      - name: Verify demo launcher and operational scripts syntax
        run: |
          node --check scripts/real-vision-demo.mjs
          node --check scripts/compose-smoke.mjs
          node --check scripts/prisma-migrate-build.mjs
          node --check scripts/post-deploy-smoke.mjs
          node --check scripts/vercel-rollback.mjs
          node --check scripts/github-incident-alert.mjs
          node --check scripts/check-operations.mjs
          node --check scripts/configure-vercel-waf.mjs
          python -m py_compile scripts/benchmark-frame-dedup.py
          python -m py_compile scripts/benchmark-frame-dedup-corpus.py
          python -c "import tomllib; d = tomllib.load(open('fly.toml', 'rb')); assert d['build']['dockerfile'] == 'docker/worker-hosted.Dockerfile'"
          docker compose -f docker-compose.yml config --quiet

      - name: Install worker for contract and end-to-end tests
        run: python -m pip install -e "workers/processor[dev]"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        env:
          OPENCONTEXT_PYTHON: python
          OPENCONTEXT_S3_E2E: "1"
          STORAGE_S3_ENDPOINT: http://127.0.0.1:9090
          STORAGE_S3_REGION: us-east-1
          STORAGE_S3_BUCKET: opencontext-test
          STORAGE_S3_ACCESS_KEY_ID: test
          STORAGE_S3_SECRET_ACCESS_KEY: test
        run: npm test

      - name: Build
        env:
          AUTH_SECRET: opencontext-build-only-auth-secret-not-for-runtime
        run: npm run build

      - name: Stop S3Mock
        if: always()
        run: docker rm -f opencontext-s3mock || true

  worker:
    name: Worker — ruff, pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: workers/processor
    env:
      OPENAI_API_KEY: ""
      OPENCODE_API_KEY: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Verify installed FFmpeg version
        run: ffmpeg -version | head -n 1

      - name: Run real image conversion checks
        run: pytest -vv tests/test_image_normalization.py

      - name: Lint
        run: ruff check src tests ../../scripts/benchmark-frame-dedup.py ../../scripts/benchmark-frame-dedup-corpus.py

      - name: Test
        run: pytest

      - name: Cache speech recognition model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-speech-v1

      - name: Install local speech recognition
        run: pip install -e ".[local]"

      - name: Real speech end-to-end fixture
        env:
          OPENCONTEXT_ASR_E2E: "1"
        run: pytest tests/test_audio_e2e.py -q

      - name: Replay captured video context
        run: |
          opencontext replay \
            ../../docs/evaluation/opencode-go-measured-context.json \
            --repo ../.. \
            --task "Implement the observed three-state settings flow." \
            --out ../../.artifacts/replayed-measured-brief.md \
            --report ../../.artifacts/replayed-measured-report.json
          python -c "import json; p=json.load(open('../../.artifacts/replayed-measured-report.json')); assert p['ok']; assert p['counts']['evidence'] == 70; assert len(p['contextSha256']) == 64; assert len(p['briefSha256']) == 64"
          opencontext replay \
            ../../docs/evaluation/opencode-go-measured-context.json \
            --repo ../.. \
            --task "Implement the observed three-state settings flow." \
            --out ../../.artifacts/replayed-measured-brief-2.md \
            --report ../../.artifacts/replayed-measured-report-2.json
          cmp ../../.artifacts/replayed-measured-brief.md ../../.artifacts/replayed-measured-brief-2.md
          cmp ../../.artifacts/replayed-measured-report.json ../../.artifacts/replayed-measured-report-2.json

  ffmpeg-static-image-regression:
    name: Worker — pinned static FFmpeg image regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workers/processor
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Download pinned static FFmpeg binary
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/ffmpeg-pinned" \
            https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-linux-x64
          echo "e7e7fb30477f717e6f55f9180a70386c62677ef8a4d4d1a5d948f4098aa3eb99  $RUNNER_TEMP/ffmpeg-pinned" | sha256sum --check
          chmod +x "$RUNNER_TEMP/ffmpeg-pinned"

      - name: Run complete still-image suite against the pinned binary
        env:
          FFMPEG_PATH: ${{ runner.temp }}/ffmpeg-pinned
        run: |
          "$FFMPEG_PATH" -version | head -n 1
          pytest -vv \
            tests/test_e2e_fixture.py::test_generated_image_completes_visual_pipeline \
            tests/test_e2e_fixture.py::test_generated_image_set_completes_cross_image_pipeline \
            tests/test_image_normalization.py

  worker-container:
    name: Worker container — packaged CLI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build worker image
        run: docker build -f docker/worker.Dockerfile -t opencontext-worker:ci .

      - name: Validate hosted and GPU Dockerfiles
        run: |
          docker buildx build --check -f docker/worker.gpu.Dockerfile .
          docker buildx build --check -f docker/worker-hosted.Dockerfile .
          docker buildx build --check -f docker/web-hosted.Dockerfile .

      - name: Verify packaged CLI
        run: docker run --rm opencontext-worker:ci opencontext --version

      - name: Generate fixture with bundled FFmpeg
        run: |
          mkdir -p .artifacts/container-smoke
          chmod 0777 .artifacts/container-smoke
          docker run --rm -v "$PWD/.artifacts:/data" opencontext-worker:ci \
            python -c "import subprocess; from imageio_ffmpeg import get_ffmpeg_exe; subprocess.run([get_ffmpeg_exe(), '-y', '-hide_banner', '-loglevel', 'error', '-f', 'lavfi', '-i', 'testsrc2=size=320x180:rate=1:duration=2', '-f', 'lavfi', '-i', 'sine=frequency=440:sample_rate=16000:duration=2', '-shortest', '-c:v', 'libx264', '-preset', 'ultrafast', '-pix_fmt', 'yuv420p', '-c:a', 'aac', '/data/container-smoke/fixture.mp4'], check=True)"

      - name: Analyze fixture with packaged CLI
        run: |
          docker run --name opencontext-worker-smoke \
            -v "$PWD/.artifacts:/data" \
            opencontext-worker:ci opencontext analyze /data/container-smoke/fixture.mp4 \
            --offline --out /data/container-smoke/context.md \
            --json /data/container-smoke/context.json

      - name: Validate evidence-bearing outputs
        run: |
          test -s .artifacts/container-smoke/context.md
          test -s .artifacts/container-smoke/context.json
          grep -q "E0001" .artifacts/container-smoke/context.md
          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('.artifacts/container-smoke/context.json','utf8'));if(!Array.isArray(p.evidence)||p.evidence.length===0)throw new Error('container analysis produced no evidence')"

      - name: Print container logs
        if: failure()
        run: docker logs opencontext-worker-smoke || true

      - name: Remove smoke container
        if: always()
        run: docker rm -f opencontext-worker-smoke || true

  postgres:
    name: PostgreSQL migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
        env:
          POSTGRES_USER: opencontext
          POSTGRES_PASSWORD: opencontext
          POSTGRES_DB: opencontext
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opencontext -d opencontext"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://opencontext:opencontext@localhost:5432/opencontext?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate PostgreSQL schema and client
        run: npm run prisma:generate:postgres --workspace web

      - name: Check generated schema is current
        run: git diff --exit-code -- apps/web/prisma/postgres/schema.prisma

      - name: Apply migrations to a fresh database
        run: npm run prisma:migrate:deploy:postgres --workspace web

      - name: Check for schema drift
        working-directory: apps/web
        run: >-
          npx prisma migrate diff
          --config prisma.postgres.config.ts
          --from-config-datasource
          --to-schema prisma/postgres/schema.prisma
          --exit-code

      - name: Load-test shared rate limiter across processes
        env:
          RATE_LIMIT_LOAD_ALLOW_RESET: "1"
        run: >-
          npm run test:rate-limit-load --
          --out .artifacts/rate-limit-load.json

  compose:
    name: Compose — upload through exports
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Ensure fixture tools
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Build and start Compose stack
        run: docker compose up -d --build db web worker-cache-init worker

      - name: Check worker model cache permissions
        run: >-
          docker compose exec -T worker python -c
          "import os; assert os.stat('/models').st_uid == 10001; open('/models/.write-test','w').close(); os.remove('/models/.write-test')"

      - name: Wait for web health
        run: |
          for attempt in {1..60}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' opencontext-web 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Generate fixture
        run: npm run fixture

      - name: Sign in, upload, process, and export
        run: node scripts/compose-smoke.mjs

      - name: Validate Compose exports
        run: |
          test -s .artifacts/compose-smoke/video/context.md
          test -s .artifacts/compose-smoke/video/context.json
          test -s .artifacts/compose-smoke/image/context.md
          test -s .artifacts/compose-smoke/image/context.json
          grep -q "E0001" .artifacts/compose-smoke/video/context.md
          node -e "const fs=require('node:fs');for(const n of ['video','image']){const p=JSON.parse(fs.readFileSync('.artifacts/compose-smoke/'+n+'/context.json','utf8'));if(!Array.isArray(p.evidence)||p.evidence.length===0)throw new Error(n+' Compose export produced no evidence')}"

      - name: Print Compose logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Compose stack
        if: always()
        run: docker compose down -v --remove-orphans

  ci-gate:
    name: CI — all checks passed
    needs: [web, worker, ffmpeg-static-image-regression, worker-container, postgres, compose]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all required CI jobs succeeded
        env:
          WEB_RESULT: ${{ needs.web.result }}
          WORKER_RESULT: ${{ needs.worker.result }}
          FFMPEG_RESULT: ${{ needs.ffmpeg-static-image-regression.result }}
          CONTAINER_RESULT: ${{ needs.worker-container.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          COMPOSE_RESULT: ${{ needs.compose.result }}
        run: |
          for pair in \
            "web:$WEB_RESULT" \
            "worker:$WORKER_RESULT" \
            "ffmpeg-static-image-regression:$FFMPEG_RESULT" \
            "worker-container:$CONTAINER_RESULT" \
            "postgres:$POSTGRES_RESULT" \
            "compose:$COMPOSE_RESULT"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            echo "$name: $result"
            if [ "$result" != "success" ]; then
              echo "::error::CI job '$name' did not succeed (result=$result)."
              exit 1
            fi
          done
