name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web — lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Start MinIO for storage integration
        run: |
          docker run -d --name opencontext-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:9000/minio/health/live; then
              exit 0
            fi
            sleep 2
          done
          docker logs opencontext-minio
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Install worker for contract and end-to-end tests
        run: python -m pip install -e "workers/processor[dev]"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        env:
          OPENCONTEXT_PYTHON: python
          OPENCONTEXT_S3_E2E: "1"
          STORAGE_S3_ENDPOINT: http://127.0.0.1:9000
          STORAGE_S3_REGION: us-east-1
          STORAGE_S3_BUCKET: opencontext-test
          STORAGE_S3_ACCESS_KEY_ID: minioadmin
          STORAGE_S3_SECRET_ACCESS_KEY: minioadmin
        run: npm test

      - name: Build
        run: npm run build

      - name: Stop MinIO
        if: always()
        run: docker rm -f opencontext-minio || true

  worker:
    name: Worker — ruff, pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/processor
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest

  postgres:
    name: PostgreSQL migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: opencontext
          POSTGRES_PASSWORD: opencontext
          POSTGRES_DB: opencontext
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opencontext -d opencontext"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://opencontext:opencontext@localhost:5432/opencontext?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate PostgreSQL schema and client
        run: npm run prisma:generate:postgres --workspace web

      - name: Check generated schema is current
        run: git diff --exit-code -- apps/web/prisma/postgres/schema.prisma

      - name: Apply migrations to a fresh database
        run: npx prisma migrate deploy --schema apps/web/prisma/postgres/schema.prisma

      - name: Check for schema drift
        run: >-
          npx prisma migrate diff
          --from-url "$DATABASE_URL"
          --to-schema-datamodel apps/web/prisma/postgres/schema.prisma
          --exit-code
