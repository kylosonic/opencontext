name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web — lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr

      - name: Start S3Mock for storage integration
        run: |
          docker run -d --name opencontext-s3mock \
            -p 9090:9090 \
            adobe/s3mock:5
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:9090/; then
              exit 0
            fi
            sleep 2
          done
          docker logs opencontext-s3mock
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Verify measured evaluation video generator
        run: npm run evaluation:video

      - name: Install worker for contract and end-to-end tests
        run: python -m pip install -e "workers/processor[dev]"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        env:
          OPENCONTEXT_PYTHON: python
          OPENCONTEXT_S3_E2E: "1"
          STORAGE_S3_ENDPOINT: http://127.0.0.1:9090
          STORAGE_S3_REGION: us-east-1
          STORAGE_S3_BUCKET: opencontext-test
          STORAGE_S3_ACCESS_KEY_ID: test
          STORAGE_S3_SECRET_ACCESS_KEY: test
        run: npm test

      - name: Build
        run: npm run build

      - name: Stop S3Mock
        if: always()
        run: docker rm -f opencontext-s3mock || true

  worker:
    name: Worker — ruff, pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/processor
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest

      - name: Replay captured video context
        run: |
          opencontext replay \
            ../../docs/evaluation/opencode-go-measured-context.json \
            --repo ../.. \
            --task "Implement the observed three-state settings flow." \
            --out ../../.artifacts/replayed-measured-brief.md \
            --report ../../.artifacts/replayed-measured-report.json
          python -c "import json; p=json.load(open('../../.artifacts/replayed-measured-report.json')); assert p['ok']; assert p['counts']['evidence'] == 70; assert len(p['contextSha256']) == 64; assert len(p['briefSha256']) == 64"
          opencontext replay \
            ../../docs/evaluation/opencode-go-measured-context.json \
            --repo ../.. \
            --task "Implement the observed three-state settings flow." \
            --out ../../.artifacts/replayed-measured-brief-2.md \
            --report ../../.artifacts/replayed-measured-report-2.json
          cmp ../../.artifacts/replayed-measured-brief.md ../../.artifacts/replayed-measured-brief-2.md
          cmp ../../.artifacts/replayed-measured-report.json ../../.artifacts/replayed-measured-report-2.json

  worker-container:
    name: Worker container — packaged CLI smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build worker image
        run: docker build -f docker/worker.Dockerfile -t opencontext-worker:ci .

      - name: Verify packaged CLI
        run: docker run --rm opencontext-worker:ci opencontext --version

      - name: Generate fixture with bundled FFmpeg
        run: |
          mkdir -p .artifacts/container-smoke
          docker run --rm -v "$PWD/.artifacts:/data" opencontext-worker:ci \
            python -c "import subprocess; from imageio_ffmpeg import get_ffmpeg_exe; subprocess.run([get_ffmpeg_exe(), '-y', '-hide_banner', '-loglevel', 'error', '-f', 'lavfi', '-i', 'testsrc2=size=320x180:rate=1:duration=2', '-f', 'lavfi', '-i', 'sine=frequency=440:sample_rate=16000:duration=2', '-shortest', '-c:v', 'libx264', '-preset', 'ultrafast', '-pix_fmt', 'yuv420p', '-c:a', 'aac', '/data/fixture.mp4'], check=True)"

      - name: Analyze fixture with packaged CLI
        run: |
          docker run --name opencontext-worker-smoke \
            -v "$PWD/.artifacts:/data" \
            opencontext-worker:ci opencontext analyze /data/fixture.mp4 \
            --offline --out /data/container-smoke/context.md \
            --json /data/container-smoke/context.json

      - name: Validate evidence-bearing outputs
        run: |
          test -s .artifacts/container-smoke/context.md
          test -s .artifacts/container-smoke/context.json
          grep -q "E0001" .artifacts/container-smoke/context.md
          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('.artifacts/container-smoke/context.json','utf8'));if(!Array.isArray(p.evidence)||p.evidence.length===0)throw new Error('container analysis produced no evidence')"

      - name: Print container logs
        if: failure()
        run: docker logs opencontext-worker-smoke || true

      - name: Remove smoke container
        if: always()
        run: docker rm -f opencontext-worker-smoke || true

  postgres:
    name: PostgreSQL migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: opencontext
          POSTGRES_PASSWORD: opencontext
          POSTGRES_DB: opencontext
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opencontext -d opencontext"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://opencontext:opencontext@localhost:5432/opencontext?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate PostgreSQL schema and client
        run: npm run prisma:generate:postgres --workspace web

      - name: Check generated schema is current
        run: git diff --exit-code -- apps/web/prisma/postgres/schema.prisma

      - name: Apply migrations to a fresh database
        run: npm run prisma:migrate:deploy:postgres --workspace web

      - name: Check for schema drift
        working-directory: apps/web
        run: >-
          npx prisma migrate diff
          --config prisma.postgres.config.ts
          --from-config-datasource
          --to-schema prisma/postgres/schema.prisma
          --exit-code

      - name: Load-test shared rate limiter across processes
        env:
          RATE_LIMIT_LOAD_ALLOW_RESET: "1"
        run: >-
          npm run test:rate-limit-load --
          --out .artifacts/rate-limit-load.json

  compose:
    name: Compose — upload through exports
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install fixture tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build and start Compose stack
        run: docker compose up -d --build db web worker

      - name: Wait for web health
        run: |
          for attempt in {1..60}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' opencontext-web 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Generate fixture
        run: npm run fixture

      - name: Sign in, upload, process, and export
        run: node scripts/compose-smoke.mjs

      - name: Validate Compose exports
        run: |
          test -s .artifacts/compose-smoke/context.md
          test -s .artifacts/compose-smoke/context.json
          grep -q "E0001" .artifacts/compose-smoke/context.md
          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('.artifacts/compose-smoke/context.json','utf8'));if(!Array.isArray(p.evidence)||p.evidence.length===0)throw new Error('Compose export produced no evidence')"

      - name: Print Compose logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Compose stack
        if: always()
        run: docker compose down -v --remove-orphans
