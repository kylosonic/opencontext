name: Post-deploy smoke

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      target_url:
        description: Optional base URL to verify (defaults to vars.WORKER_API_URL or deployment environment_url)
        required: false
        type: string
      rollback_dry_run:
        description: Run Vercel Instant Rollback resolution in dry-run mode without mutating Production
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-verify-${{ github.event.deployment.environment || 'manual' }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify live deployment
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Run post-deploy smoke checks
        id: smoke
        env:
          INPUT_TARGET_URL: ${{ inputs.target_url }}
          VAR_TARGET_URL: ${{ vars.WORKER_API_URL }}
          DEPLOY_TARGET_URL: ${{ github.event.deployment_status.environment_url }}
          OPS_API_TOKEN: ${{ secrets.OPS_API_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_WEBHOOK_SECRET: ${{ secrets.ALERT_WEBHOOK_SECRET }}
        run: |
          target="${INPUT_TARGET_URL:-${VAR_TARGET_URL:-$DEPLOY_TARGET_URL}}"
          target="${target%"${target##*[![:space:]]}"}"
          target="${target#"${target%%[![:space:]]*}"}"
          if [ -z "$target" ]; then
            echo "::error::Could not resolve deployment target URL."
            exit 1
          fi
          export OPENCONTEXT_BASE_URL="$target"
          node scripts/post-deploy-smoke.mjs

      - name: Roll back failed Vercel production deployment
        if: >-
          !cancelled() && (
            (failure() && github.event_name == 'deployment_status') ||
            (github.event_name == 'workflow_dispatch' && inputs.rollback_dry_run == true)
          )
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          FAILED_DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url }}
          FAILED_COMMIT_SHA: ${{ github.sha }}
          VERCEL_ROLLBACK_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_dry_run == true && 'true' || 'false' }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Automatic rollback skipped: set VERCEL_TOKEN secret and VERCEL_PROJECT_ID repository variable to enable Vercel rollback."
            exit 0
          fi
          node scripts/vercel-rollback.mjs

      - name: Sync GitHub incident issue
        if: always() && (steps.smoke.outcome == 'success' || steps.smoke.outcome == 'failure')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INCIDENT_KEY: deploy-smoke
          INCIDENT_TITLE: "Production post-deploy smoke check failed"
          INCIDENT_STATUS: ${{ steps.smoke.outcome == 'success' && 'healthy' || 'unhealthy' }}
          INCIDENT_SUMMARY_PATH: .artifacts/deploy-smoke/summary.json
          INCIDENT_ROLLBACK_PATH: .artifacts/deploy-smoke/rollback.json
          INCIDENT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/github-incident-alert.mjs
