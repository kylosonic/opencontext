name: Worker schedule

on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [job-queued]
  workflow_dispatch:

concurrency:
  group: opencontext-worker
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  drain:
    if: github.repository == 'kylosonic/opencontext'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prevent private-repository compute charges
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_PRIVATE_ACTIONS_MINUTES: ${{ vars.ALLOW_PRIVATE_ACTIONS_MINUTES }}
        run: |
          visibility="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.visibility')"
          if [ "$visibility" != "public" ] && [ "$ALLOW_PRIVATE_ACTIONS_MINUTES" != "true" ]; then
            echo "::error::The continuous Actions relay is enabled only for this public repository. Set ALLOW_PRIVATE_ACTIONS_MINUTES=true only if you accept private Actions minute billing."
            exit 1
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: workers/processor/pyproject.toml

      - name: Cache transcription models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ vars.TRANSCRIPTION_MODEL || 'base' }}

      - name: Install worker
        run: |
          python -m pip install --upgrade pip
          pip install "./workers/processor[local]"

      - name: Require repository worker configuration
        env:
          WORKER_API_URL: ${{ vars.WORKER_API_URL }}
          WORKER_API_TOKEN: ${{ secrets.WORKER_API_TOKEN }}
        run: |
          test -n "$WORKER_API_URL" || { echo "::error::Set the WORKER_API_URL repository variable"; exit 1; }
          test -n "$WORKER_API_TOKEN" || { echo "::error::Set the WORKER_API_TOKEN repository secret"; exit 1; }

      - name: Drain queue
        env:
          OPENCONTEXT_SKIP_DOTENV: "1"
          CONTINUOUS_RELAY: ${{ github.event_name == 'schedule' && '1' || '0' }}
          WORKER_API_URL: ${{ vars.WORKER_API_URL }}
          WORKER_API_TOKEN: ${{ secrets.WORKER_API_TOKEN }}
          WORKER_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
          TRANSCRIPTION_PROVIDER: faster_whisper
          TRANSCRIPTION_MODEL: ${{ vars.TRANSCRIPTION_MODEL || 'base' }}
          VISION_PROVIDER: openai_compatible
          VISION_MODEL: ${{ vars.VISION_MODEL || 'hy4-flash-free' }}
          VISION_FALLBACK_MODELS: ${{ vars.VISION_FALLBACK_MODELS || 'glm-5.3-flash' }}
          VISION_REQUEST_INTERVAL_SECONDS: "5"
          VISION_CONCURRENCY: "1"
          VISION_MAX_FRAMES: "60"
          OCR_PROVIDER: vision
          TEXT_PROVIDER: template
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://opencode.ai/inference/go/openai/v1' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Scheduled runs stay alive while the next run waits in the serialized
          # concurrency group. Together they provide continuous low-latency
          # claiming without a paid host. Manual and dispatched runs exit when
          # the queue is empty so they do not hold a runner unnecessarily.
          if [ "$CONTINUOUS_RELAY" = "1" ]; then
            python -m oc_worker.main --drain-seconds 900
          else
            python -m oc_worker.main --drain-seconds 900 --exit-on-idle
          fi
        timeout-minutes: 17

      - name: Check operations alerts
        id: ops_check
        if: always()
        env:
          OPENCONTEXT_BASE_URL: ${{ vars.WORKER_API_URL }}
          OPS_API_TOKEN: ${{ secrets.OPS_API_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_WEBHOOK_SECRET: ${{ secrets.ALERT_WEBHOOK_SECRET }}
        run: |
          if [ -z "$OPENCONTEXT_BASE_URL" ]; then
            echo "::error::WORKER_API_URL is required for the operations check."
            exit 1
          fi
          if [ -z "$OPS_API_TOKEN" ]; then
            echo "::warning::OPS_API_TOKEN is not set on the repository; operations checks were skipped."
            exit 0
          fi
          node scripts/check-operations.mjs

      - name: Sync operations incident issue
        if: always() && (steps.ops_check.outcome == 'success' || steps.ops_check.outcome == 'failure')
        env:
          WORKER_API_URL: ${{ vars.WORKER_API_URL }}
          OPS_API_TOKEN: ${{ secrets.OPS_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INCIDENT_KEY: ops-alert
          INCIDENT_TITLE: "OpenContext operations health alert"
          INCIDENT_STATUS: ${{ steps.ops_check.outcome == 'success' && 'healthy' || 'unhealthy' }}
          INCIDENT_SUMMARY_PATH: .artifacts/operations/summary.json
          INCIDENT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WORKER_API_URL" ] || [ -z "$OPS_API_TOKEN" ]; then
            echo "Operations incident sync skipped because WORKER_API_URL or OPS_API_TOKEN is unset."
            exit 0
          fi
          node scripts/github-incident-alert.mjs

      - name: Reconcile terminal usage records
        if: always()
        env:
          OPENCONTEXT_BASE_URL: ${{ vars.WORKER_API_URL }}
          OPS_API_TOKEN: ${{ secrets.OPS_API_TOKEN }}
        run: |
          if [ -z "$OPENCONTEXT_BASE_URL" ] || [ -z "$OPS_API_TOKEN" ]; then
            echo "::warning::Usage reconciliation skipped because WORKER_API_URL or OPS_API_TOKEN is unset."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --max-time 30 \
            -X POST \
            -H "Authorization: Bearer $OPS_API_TOKEN" \
            "$OPENCONTEXT_BASE_URL/api/ops/usage/reconcile"
