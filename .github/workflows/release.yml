name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: python -m pip install -e "workers/processor[dev]"
      - run: python scripts/check-release-version.py
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: ruff check workers/processor/src workers/processor/tests
      - run: pytest workers/processor/tests -q

  python-package:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build workers/processor
      - run: python -m twine check workers/processor/dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: workers/processor/dist/

  npm-package:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build --workspace @opencontext/schemas
      - run: npm publish --workspace @opencontext/schemas --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
