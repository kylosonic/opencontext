name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg tesseract-ocr
      - run: npm ci
      - run: python -m pip install -e "workers/processor[dev]"
      - if: github.ref_type == 'tag'
        run: python scripts/check-release-version.py
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          AUTH_SECRET: opencontext-build-only-auth-secret-not-for-runtime
      - run: ruff check workers/processor/src workers/processor/tests
      - run: pytest workers/processor/tests -q

  python-package:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build workers/processor
      - run: python -m twine check workers/processor/dist/*
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: workers/processor/dist/
          skip-existing: true

  npm-package:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build --workspace @kylosonic/opencontext-schemas
      - name: Verify npm OIDC credentials
        run: |
          node - <<'NODE'
          const tokenUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
          const requestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          if (!tokenUrl || !requestToken) throw new Error("Missing GitHub OIDC request credentials");
          const url = new URL(tokenUrl);
          url.searchParams.set("audience", "npm:registry.npmjs.org");
          const response = await fetch(url, {
            headers: { Authorization: `Bearer ${requestToken}` },
          });
          if (!response.ok) throw new Error(`GitHub OIDC token request failed: ${response.status}`);
          const payload = await response.json();
          if (!payload.value) throw new Error("GitHub OIDC token response did not contain a token");
          console.log("npm OIDC credentials are available");
          NODE
      - name: Check whether the npm version is already published
        id: published
        shell: bash
        run: |
          version="$(node -p "require('./packages/schemas/package.json').version")"
          if npm view "@kylosonic/opencontext-schemas@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.exists != 'true'
        run: npm publish --workspace @kylosonic/opencontext-schemas --access public

  container-images:
    name: Containers (${{ matrix.name }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: opencontext-web
            dockerfile: docker/web-hosted.Dockerfile
          - name: opencontext-worker
            dockerfile: docker/worker-hosted.Dockerfile
          - name: opencontext-worker-cli
            dockerfile: docker/worker.Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          flavor: |
            latest=auto

      - name: Build and push container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  github-release:
    name: Create GitHub Release
    needs: [verify, python-package, npm-package, container-images]
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create GitHub Release if absent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; skipping creation."
            exit 0
          fi
          version="${TAG#v}"
          printf '%s\n' \
            "### Published Packages & Container Images" \
            "" \
            "- **Python CLI / Worker (\`opencontext-video\`):** \`pip install opencontext-video==${version}\` ([PyPI](https://pypi.org/project/opencontext-video/${version}/))" \
            "- **TypeScript Schemas (\`@kylosonic/opencontext-schemas\`):** \`npm install @kylosonic/opencontext-schemas@${version}\` ([npm](https://www.npmjs.com/package/@kylosonic/opencontext-schemas/v/${version}))" \
            "- **GitHub Action:** \`uses: kylosonic/opencontext@${TAG}\`" \
            "- **Web Hosted Image:** \`ghcr.io/${OWNER}/opencontext-web:${version}\`" \
            "- **Worker Hosted Image:** \`ghcr.io/${OWNER}/opencontext-worker:${version}\`" \
            "- **Worker CLI Image:** \`ghcr.io/${OWNER}/opencontext-worker-cli:${version}\`" \
            > /tmp/release-notes.md
          gh release create "$TAG" \
            --verify-tag \
            --generate-notes \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md

  release-verify:
    name: Verify published release artifacts
    needs: github-release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Install and inspect published packages
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 18); do
            if python -m pip install --disable-pip-version-check \
              "opencontext-video==${version}"; then
              break
            fi
            if [[ "$attempt" == "18" ]]; then
              echo "PyPI artifact did not become installable in time" >&2
              exit 1
            fi
            sleep 10
          done
          test "$(opencontext --version)" = "opencontext ${version}"
          python - <<PY
          import oc_worker

          assert oc_worker.__version__ == "${version}", oc_worker.__version__
          PY

          npm_dir="$(mktemp -d)"
          for attempt in $(seq 1 18); do
            if npm install --prefix "$npm_dir" --no-audit --no-fund --prefer-online \
              "@kylosonic/opencontext-schemas@${version}"; then
              break
            fi
            if [[ "$attempt" == "18" ]]; then
              echo "npm artifact did not become installable in time" >&2
              exit 1
            fi
            sleep 10
          done
          cd "$npm_dir"
          node --input-type=module - <<'NODE'
          const schemas = await import("@kylosonic/opencontext-schemas");
          if (!schemas.JobDetailSchema || !schemas.WorkerClaimRequestSchema) {
            throw new Error("published schemas are missing expected exports");
          }
          console.log("published npm schemas import successfully");
          NODE

      - name: Verify GHCR images and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for image in opencontext-web opencontext-worker opencontext-worker-cli; do
            docker buildx imagetools inspect "ghcr.io/${owner}/${image}:${version}" >/dev/null
          done
          gh release view "$GITHUB_REF_NAME" --json tagName,isDraft,isPrerelease,publishedAt >/tmp/release.json
          python - <<'PY'
          import json

          release = json.load(open("/tmp/release.json", encoding="utf-8"))
          assert release["isDraft"] is False
          assert release["isPrerelease"] is False
          assert release["publishedAt"]
          PY

      - name: Run the tagged composite action with default package version
        id: action
        uses: ./
        with:
          media: docs/assets/real-vision-checkout.png
          repository: .
          task: Verify the published release action and evidence pipeline.
          output-dir: .artifacts/release-action
          detail-level: MEDIUM
          offline: "true"

      - name: Validate action outputs and replay
        env:
          OPENCONTEXT_JSON: ${{ steps.action.outputs.json }}
          OPENCONTEXT_BRIEF: ${{ steps.action.outputs.brief }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$OPENCONTEXT_JSON"
          test -s "$OPENCONTEXT_BRIEF"
          opencontext replay "$OPENCONTEXT_JSON" \
            --repo . \
            --task "Verify the published release action and evidence pipeline." \
            --out .artifacts/release-action/replayed-brief.md \
            --report .artifacts/release-action/replay-report.json
          cmp "$OPENCONTEXT_BRIEF" .artifacts/release-action/replayed-brief.md
