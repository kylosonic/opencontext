name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: npm ci
      - run: python -m pip install -e "workers/processor[dev]"
      - run: |
          if [ "$GITHUB_REF_TYPE" = "branch" ]; then
            python - "$GITHUB_SHA" <<'PY'
          import json
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          root = Path.cwd()
          python_version = tomllib.loads((root / "workers/processor/pyproject.toml").read_text())["project"]["version"]
          npm_version = json.loads((root / "packages/schemas/package.json").read_text())["version"]
          print(f"Workflow dispatch: Python {python_version}, npm {npm_version}, commit {sys.argv[1]}")
          PY
          else
            python scripts/check-release-version.py
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: ruff check workers/processor/src workers/processor/tests
      - run: pytest workers/processor/tests -q

  python-package:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build workers/processor
      - run: python -m twine check workers/processor/dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: workers/processor/dist/
          skip-existing: true

  npm-package:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build --workspace @kylosonic/opencontext-schemas
      - name: Verify npm OIDC credentials
        run: |
          node - <<'NODE'
          const tokenUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
          const requestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          if (!tokenUrl || !requestToken) throw new Error("Missing GitHub OIDC request credentials");
          const url = new URL(tokenUrl);
          url.searchParams.set("audience", "npm:registry.npmjs.org");
          const response = await fetch(url, {
            headers: { Authorization: `Bearer ${requestToken}` },
          });
          if (!response.ok) throw new Error(`GitHub OIDC token request failed: ${response.status}`);
          const payload = await response.json();
          if (!payload.value) throw new Error("GitHub OIDC token response did not contain a token");
          console.log("npm OIDC credentials are available");
          NODE
      - name: Check whether the npm version is already published
        id: published
        shell: bash
        run: |
          version="$(node -p "require('./packages/schemas/package.json').version")"
          if npm view "@kylosonic/opencontext-schemas@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.exists != 'true'
        run: |
          args=(--workspace @kylosonic/opencontext-schemas --access public)
          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            args+=(--tag trusted-publishing-check)
          fi
          npm publish "${args[@]}"
