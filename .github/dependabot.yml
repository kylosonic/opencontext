version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "UTC"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # TypeScript 7 remains outside typescript-eslint's supported peer range.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"
      - "javascript"

  - package-ecosystem: "pip"
    directory: "/workers/processor"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:15"
      timezone: "UTC"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Faster Whisper 1.2.1 still uses a PyAV API removed in PyAV 19.
      - dependency-name: "av"
        update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "UTC"
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:45"
      timezone: "UTC"
    groups:
      docker-base-images:
        patterns:
          - "*"
    ignore:
      # Runtime major upgrades require separate driver and compatibility suites.
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "nvidia/cuda"
        update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"
      - "docker"
